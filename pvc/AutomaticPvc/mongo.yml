# ---------------------------------------------------------
# Step 1: StorageClass (AWS EBS gp3)
# ---------------------------------------------------------
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: aws-gp3-storageclass
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
parameters:
  type: gp3

---
# ---------------------------------------------------------
# Step 2: PersistentVolumeClaim
# ---------------------------------------------------------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aws-ebs-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: aws-gp3-storageclass
  resources:
    requests:
      storage: 50Gi

---
# ---------------------------------------------------------
# Step 3: Pod that uses the PVC
# ---------------------------------------------------------
apiVersion: v1
kind: Pod
metadata:
  name: ebs-test-pod
spec:
  containers:
    - name: app
      image: nginx
      volumeMounts:
        - mountPath: "/data"
          name: ebs-storage
  volumes:
    - name: ebs-storage
      persistentVolumeClaim:
        claimName: aws-ebs-pvc
